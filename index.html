*{box-sizing:border-box}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:15px;margin-bottom:8px}
.mode{font-size:12px;color:var(--muted);font-weight:500}
.progress{height:7px;background:#e4e9f0;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);padding:26px;margin-top:15px
}
h1{font-size:26px;line-height:1.28;margin:0 0 10px}
h2{font-size:20px;line-height:1.35;margin:0 0 12px}
h3{font-size:16px;margin:18px 0 7px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.notice,.warning,.dangerbox,.successbox{
  padding:12px 14px;border-radius:10px;margin:14px 0;border-left:4px solid
}
.notice{background:var(--accentSoft);border-left-color:var(--accent)}
.warning{background:var(--warnSoft);border-left-color:#f79009}
.dangerbox{background:var(--dangerSoft);border-left-color:var(--danger)}

.profile-block strong{display:block;margin-bottom:4px}

.profile-detail{color:#344054}
.profile-guide{
  padding:10px 12px;border:1px dashed #b8c4d4;background:#fbfcfe;
  border-radius:10px;margin:10px 0 14px;font-size:13px;color:#475467

.question{padding:15px 0;border-top:1px solid #edf0f4}
.question:first-child{border-top:none}
.qtext{font-weight:600;margin-bottom:9px}
.option{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
  border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;margin:7px 0
}
.option:hover{border-color:#a7b8cf;background:#fbfcfe}
.option input{margin-top:4px}
.likert{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.likert label{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:10px;padding:8px 4px;cursor:pointer;
  min-height:52px;background:#fff;font-size:12px
}
.likert label:hover{border-color:#a7b8cf;background:#fbfcfe}
.likert input{margin:0 0 3px}
.likert-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:5px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
button{
  border:0;border-radius:10px;padding:11px 18px;font-size:15px;
  cursor:pointer;transition:opacity .15s,transform .05s

button:active{transform:translateY(1px)}
button:disabled{opacity:.48;cursor:not-allowed}
.primary{background:var(--accent);color:#fff}
.secondary{background:#edf1f6;color:var(--text)}
.danger{background:#fee4e2;color:var(--danger)}
.error{color:var(--danger);font-size:14px;margin-top:10px}
.success{color:var(--ok)}
.pill{display:inline-block;padding:4px 8px;background:#eef4ff;color:#274e8a;border-radius:999px;font-size:12px;margin-right:6px}
.timer{font-size:12px;color:var(--muted);margin-top:8px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left;vertical-align:top}
th{background:#f8fafc;position:sticky;top:0}
.admin-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.admin-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}

.hp{position:absolute!important;left:-99999px!important;width:1px!important;height:1px!important;overflow:hidden!important}

function mean(xs){
  const v=xs.filter(x=>Number.isFinite(+x)).map(Number);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}
function median(xs){
  const a=xs.filter(x=>Number.isFinite(+x)).map(Number).sort((x,y)=>x-y);
  if(!a.length)return null;
  const m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}

function newState(){
  const liveParams=new URLSearchParams(location.search);
  const pid=(liveParams.get(CONFIG.PID_PARAM)||"").trim();
  const recruitmentSource=pid ? "panel" : "direct";
  const rid=pid?"pid:"+pid:uuid();
  const seed=hashString(rid+"|cav-final-v11");
  const rand=mulberry32(seed);

  // Pre-generated balanced-block assignment.
  // Across 27 blocks, every one of the 27 A×B×C profiles appears exactly four times.
  // Within every block, A/B/C each cover levels 1, 2 and 3 at least once.
  const blockIndex=seed % BALANCED_BLOCKS.length;
  let profiles=BALANCED_BLOCKS[blockIndex].map(p=>({...p}));
  profiles=shuffle(profiles,rand).map((p,i)=>({
    ...p,
    profile_id:`A${p.A}B${p.B}C${p.C}`,
    order:i+1
  }));

  return {
    version:CONFIG.VERSION,
    study_phase:CONFIG.STUDY_PHASE,
    recruitment_source:recruitmentSource,
    respondent_id:rid,
    platform_pid:pid,
    seed,
    block_id:`BLK${String(blockIndex+1).padStart(2,"0")}`,
    started_at:nowISO(),
    start_ms:Date.now(),
    page:"consent",
    completed:false,
    blocked:false,
    blocked_reason:null,

    screening:{},
    comprehension:{
      first:{}, retry:{}, first_fail_count:0, retry_fail_count:0
    },

    qo1:null,
    profiles,
    vignette_answers:{},
    vignette_timing:{},
    deep_profile_index:Math.floor(rand()*4),
    deep_answers:{},
    deep_timing:{},
    attitudes:{},
    background:{},
    demographics:{},

    interaction_times:[],

    honeypot:"",

  };
}

function armMinimumTime(buttonSelector, ms, labelReady){
  const btn=$(buttonSelector);

  const started=Date.now();

/* =========================================================
   4B. CLOUD SUBMISSION
   ========================================================= */
async function postToSupabase(status){
  const snapshot = JSON.parse(JSON.stringify(state));
  snapshot.cloud_status = status;

  const row = {
    respondent_id: state.respondent_id,
    platform_pid: state.platform_pid || null,
    block_id: status==="screened_out" ? null : (state.block_id || null),
    survey_version: state.version || CONFIG.VERSION,
    study_phase: state.study_phase || CONFIG.STUDY_PHASE,
    recruitment_source: state.recruitment_source || (state.platform_pid ? "panel" : "direct"),
    status,
    payload: snapshot,
    quality: state.quality || null,
    client_started_at: state.started_at || null,
    client_submitted_at: state.submitted_at || state.blocked_at || nowISO(),
    client_duration_sec: Number.isFinite(Number(state.duration_sec)) ? Number(state.duration_sec) : null,
    user_agent: navigator.userAgent
  };

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), CLOUD.TIMEOUT_MS);

  try{
    const response = await fetch(
      CLOUD.SUPABASE_URL + "/rest/v1/" + CLOUD.TABLE,
      {
        method:"POST",
        headers:{
          "apikey": CLOUD.SUPABASE_PUBLISHABLE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify(row),
        signal:controller.signal
      }
    );

    // A duplicate respondent_id (HTTP 409 after unique index is enabled)
    // is treated as already received, not as a failed questionnaire.
    if(response.status===409){
      return {ok:true, duplicate:true, status:409};
    }

    if(!response.ok){
      const text = await response.text();
      throw new Error("HTTP "+response.status+"\\n"+text);
    }

    return {ok:true, duplicate:false, status:response.status};
  } finally {
    clearTimeout(timer);
  }
}

/* =========================================================
   5. QUALITY EVALUATION
   ========================================================= */
function qualityMetrics(s){
  const vignetteDur=(s.profiles||[]).map(p=>s.vignette_timing?.[p.profile_id]?.duration_ms).filter(Number.isFinite);
  const fastVignetteCount=vignetteDur.filter(x=>x<CONFIG.FAST_VIGNETTE_MS).length;

  const core=[];
  (s.profiles||[]).forEach(p=>{
    const a=s.vignette_answers?.[p.profile_id];
    if(a)VIGNETTE_ITEMS.forEach(([k])=>core.push(Number(a[k])));
  });

  const deep=DEEP_ITEMS.map(([k])=>Number(s.deep_answers?.[k])).filter(Number.isFinite);
  const oppositeDiff=(s.qo1!=null&&s.background?.qo2!=null)
    ?Math.abs(Number(s.qo1)-(8-Number(s.background.qo2))):null;
  const repeatDiff=(s.deep_answers?.ps1!=null&&s.repeat_ps1!=null)
    ?Math.abs(Number(s.deep_answers.ps1)-Number(s.repeat_ps1)):null;

  const ac1Fail=s.attention?.ac1!=null&&Number(s.attention.ac1)!==5;
  const ac2Fail=s.attention?.ac2!=null&&Number(s.attention.ac2)!==2;
  const attentionFailCount=Number(ac1Fail)+Number(ac2Fail);

  const intTimes=(s.interaction_times||[]).map(x=>x.t).sort((a,b)=>a-b);
  const gaps=[];
  for(let i=1;i<intTimes.length;i++){
    const d=intTimes[i]-intTimes[i-1];
    if(d>=0&&d<10000)gaps.push(d);
  }
  const medianGap=median(gaps);

  return {
    comprehension_retry_fail:(s.comprehension?.retry_fail_count||0)>0,
    attention_fail_count:attentionFailCount,
    attention_ac1_fail:ac1Fail,
    attention_ac2_fail:ac2Fail,
    opposite_diff:oppositeDiff,
    opposite_flag:oppositeDiff!=null&&oppositeDiff>=CONFIG.OPPOSITE_DIFF_FLAG,
    repeat_diff:repeatDiff,
    repeat_flag:repeatDiff!=null&&repeatDiff>=CONFIG.REPEAT_DIFF_FLAG,
    repeat_extreme:repeatDiff!=null&&repeatDiff>=CONFIG.REPEAT_DIFF_EXTREME,
    fast_vignette_count:fastVignetteCount,
    fast_vignette_flag:fastVignetteCount>=CONFIG.FAST_VIGNETTE_COUNT_FLAG,
    straightline_core:core.length===20&&new Set(core).size===1,
    straightline_deep:deep.length===15&&new Set(deep).size===1,
    interaction_median_gap_ms:medianGap,
    rapid_interaction_flag:medianGap!=null&&medianGap<450&&intTimes.length>=25,
    honeypot_flag:Boolean((s.honeypot||"").trim()),
    total_duration_sec:Math.round((Date.now()-s.start_ms)/1000),
    total_speed_flag:Math.round((Date.now()-s.start_ms)/1000)<CONFIG.HARD_MIN_TOTAL_SEC,
    hidden_count:s.focus?.hidden_count||0,
    hidden_ms:s.focus?.hidden_ms||0
  };
}

function finalQualityDecision(s){
  const m=qualityMetrics(s);
  const reasons=[];
  const flags=[];

  // Immediate / high-specificity failures
  if(m.comprehension_retry_fail) reasons.push("comprehension_retry_failed");
  if(m.honeypot_flag) reasons.push("honeypot_triggered");
  if(m.attention_fail_count>=2) reasons.push("two_attention_checks_failed");

  // Independent soft indicators
  if(m.attention_fail_count===1)flags.push("one_attention_fail");
  if(m.opposite_flag)flags.push("opposite_inconsistency");
  if(m.repeat_flag)flags.push("repeat_inconsistency");
  if(m.fast_vignette_flag)flags.push("multiple_fast_vignettes");
  if(m.straightline_core)flags.push("core_straightline");
  if(m.straightline_deep)flags.push("deep_straightline");
  if(m.rapid_interaction_flag)flags.push("rapid_interaction");
  if(m.total_speed_flag)flags.push("very_short_total_time");

  // Extra conservative rule: an extreme same-profile reversal plus any other problem.
  if(m.repeat_extreme && flags.length>=2)reasons.push("extreme_repeat_inconsistency_plus_other_flag");

  // Composite failure requires several independent indicators.
  const score=flags.length;
  if(score>=CONFIG.COMPOSITE_BLOCK_SCORE)reasons.push("multiple_independent_quality_failures");

  return {
    metrics:m,
    flags:[...new Set(flags)],
    hard_reasons:[...new Set(reasons)],
    score,
    pass:reasons.length===0
  };
}

    const a=r.vignette_answers?.[p.profile_id]||{};
    ls.push([
      r.respondent_id,r.platform_pid,r.block_id,p.profile_id,p.order,p.A,p.B,p.C,

    ].map(csvEscape).join(","));
  }));
  download("vignette_long.csv",ls.join("\n"),"text/csv;charset=utf-8");
}

function exportDeep(rows){
  const h=["respondent_id","deep_profile_id","A","B","C",...DEEP_ITEMS.map(([k])=>k),"repeat_ps1","repeat_diff"];
  const ls=[h.map(csvEscape).join(",")];

    ls.push([
      r.respondent_id,r.deep_profile_id,p.A,p.B,p.C,
      ...DEEP_ITEMS.map(([k])=>r.deep_answers?.[k]),
      r.repeat_ps1,r.repeat_diff
    ].map(csvEscape).join(","));
  });
  download("deep_wide.csv",ls.join("\n"),"text/csv;charset=utf-8");
}

function exportQuality(rows){
  const h=[
    "status","respondent_id","duration_sec","quality_score","quality_flags","hard_reasons",
    "first_comprehension_fail_count","retry_comprehension_fail_count",
    "attention_fail_count","opposite_diff","repeat_diff","fast_vignette_count",
    "straightline_core","straightline_deep","rapid_interaction_flag",
    "total_speed_flag","hidden_count","hidden_ms","honeypot"
  ];
  const ls=[h.map(csvEscape).join(",")];
  rows.forEach(r=>{
    const m=r.quality?.metrics||{};
    ls.push([
      r._status||"",r.respondent_id,r.duration_sec||m.total_duration_sec,r.quality?.score,
      (r.quality?.flags||[]).join("|"),(r.quality?.hard_reasons||[]).join("|"),
      r.comprehension?.first_fail_count,r.comprehension?.retry_fail_count,
      m.attention_fail_count,m.opposite_diff,m.repeat_diff,m.fast_vignette_count,
      m.straightline_core,m.straightline_deep,m.rapid_interaction_flag,
      m.total_speed_flag,m.hidden_count,m.hidden_ms,m.honeypot_flag
    ].map(csvEscape).join(","));
  });
  download("quality_audit.csv",ls.join("\n"),"text/csv;charset=utf-8");
}

function render(){

  </section>`;

  armMinimumTime("#next",CONFIG.MIN_READ_MS.attitudes,"继续");

  document.querySelectorAll('input[name="cavexp"]').forEach(el=>el.addEventListener("change",()=>{

    if(el.value!=="4"&&el.checked){const none=boxes.find(x=>x.value==="4");if(none)none.checked=false}
  }));

  $("#next").onclick=()=>{
    const names=ATTITUDE_ITEMS.map(([k])=>"a_"+k).concat(["a_cav_familiarity","a_connected_familiarity"]);
    if(!requireRadios(names))return;
    const exp=[...document.querySelectorAll('input[name="cavexp"]:checked')].map(x=>x.value);
    const privacyIncident=getTextRadio("privacyincident");
    if(!exp.length)return showError("请选择至少一项相关体验。");

    state.attitudes.cav_familiarity=getRadio("a_cav_familiarity");
    state.attitudes.connected_familiarity=getRadio("a_connected_familiarity");
    state.attitudes.cav_experience=exp;
    state.attitudes.privacy_incident=privacyIncident;
    pageLeave("attitudes");
    state.page="attention2";save();render();
  };
}

/* =========================================================
   18. SUBMISSION GATE
   ========================================================= */
async function evaluateAndSubmit(){
  state.deep_profile_id=state.profiles[state.deep_profile_index].profile_id;
  state.repeat_diff=Math.abs(Number(state.deep_answers.ps1)-Number(state.repeat_ps1));
  state.duration_sec=Math.round((Date.now()-state.start_ms)/1000);
  state.quality=finalQualityDecision(state);

  if(!state.quality.pass){
    return blockNow(state.quality.hard_reasons.join("|")||"quality_gate_failed",true);
  }

  state.completed=true;
  state.submitted_at=nowISO();

  // Critical response path:
  // keep the full current state locally only until Supabase confirms receipt.
  save();
  const cloudOk=await submitAcceptedToCloud();
  if(!cloudOk)return;

  minimizeFinalLocalState("complete");
  render();
}

async function blockNow(reason,keepQuality=false){
  state.blocked=true;
  state.completed=false;
  state.blocked_reason=reason;
  state.blocked_at=nowISO();
  state.duration_sec=Math.round((Date.now()-state.start_ms)/1000);
  if(!keepQuality)state.quality=finalQualityDecision(state);
  state.page="blocked";
  save();

  // Preserve rejected cases centrally for the exclusion audit.
  const ok=await submitRejectedToCloud();
  if(ok)minimizeFinalLocalState("blocked");
  renderBlocked();
}

function renderBlocked(){
  setProgress(1);
  app.innerHTML=`<section class="card">
    <h1>本次问卷无法作为有效样本提交</h1>
    <div class="dangerbox">
      系统检测到本次作答未达到研究的数据质量要求，因此不会计入有效样本。
    </div>
    <p>感谢您的时间。为保证研究数据质量，本页面不会显示具体判定规则。</p>
    ${isDebug?`<div class="debug">${esc(JSON.stringify(state.quality,null,2))}</div>`:""}
    <div class="actions">${newResponseButton()}</div>
  </section>`;
  if($("#newResponse"))$("#newResponse").onclick=startNewResponse;
}


/* =========================================================
   18B. CLOUD ERROR / RETRY
   ========================================================= */
function renderCloudError(){
  setProgress(.98);
  app.innerHTML=`<section class="card">
    <h1>数据暂未成功上传</h1>
    <div class="warning">
      您的回答已经保存在当前设备中，但中央数据库暂时没有确认收到数据。
      <b>请不要关闭页面。</b>
    </div>
    <p>这通常由临时网络波动造成。请检查网络后点击“重新上传”。</p>
    <p class="small muted">重新上传不会要求您重新填写问卷。</p>
    ${isDebug?`<div class="debug">${esc(state.cloud?.last_error||"")}</div>`:""}
    <div class="actions">
      <button class="primary" id="retryCloud">重新上传</button>
    </div>
  </section>`;

  $("#retryCloud").onclick=async()=>{
    const btn=$("#retryCloud");
    btn.disabled=true;
    btn.textContent="正在上传……";
    const ok=await submitAcceptedToCloud();
    if(ok){
      state.page="complete";
      save();
      render();
    }else{
      btn.disabled=false;
      btn.textContent="重新上传";
    }
  };
}

function exitSurvey(){
  // Clear the current local questionnaire marker on confirmed exit.
  try{ localStorage.removeItem(CONFIG.STORAGE_KEY); }catch{}

  // Browsers do not always allow script-closing a tab opened by the user.
  // Try to close first; if blocked, replace the page with a blank terminal page.
  try{
    window.open("", "_self");
    window.close();
  }catch{}

  setTimeout(()=>{
    try{ location.replace("about:blank"); }catch{
      document.body.innerHTML="<main style='font-family:sans-serif;padding:40px;text-align:center'><h2>问卷已结束</h2><p>您现在可以关闭此页面。</p></main>";
    }
  },150);
}
