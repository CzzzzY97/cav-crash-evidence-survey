<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supabase 连接测试｜CAV Survey</title>
<style>
body{margin:0;background:#f4f6f8;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.wrap{max-width:680px;margin:70px auto;padding:18px}
.card{background:#fff;border:1px solid #d9e0e8;border-radius:16px;padding:28px;box-shadow:0 8px 28px rgba(16,24,40,.08)}
h1{font-size:24px;margin:0 0 12px}p{line-height:1.7}
button{border:0;border-radius:10px;padding:12px 18px;background:#315f96;color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.box{margin-top:18px;padding:14px;border-radius:10px;background:#f8fafc;border:1px solid #d9e0e8;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.ok{background:#edf8f1;border-color:#a8d5b9;color:#12643c}
.err{background:#fff1f0;border-color:#f0b7b2;color:#9f241b}
.small{font-size:13px;color:#667085}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Supabase 云数据库连接测试</h1>
    <p>点击下面按钮后，本页面会向 <b>survey_submissions</b> 写入一条测试记录。</p>
    <p class="small">如果成功，Supabase → Table Editor → survey_submissions 中会新增 1 行。</p>
    <button id="testBtn">发送测试记录</button>
    <div id="result" class="box">等待测试……</div>
  </div>
</div>
<script>
"use strict";

const SUPABASE_URL = "https://rdrmuuemliyvqpkrhtax.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_T_Au-ACIjNWpOBTdB01rhg_mpZ2-zAj";

const btn = document.getElementById("testBtn");
const result = document.getElementById("result");

function makeId(){
  return "TEST-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
}

async function sendTest(){
  btn.disabled = true;
  result.className = "box";
  result.textContent = "正在连接 Supabase……";

  const respondentId = makeId();
  const now = new Date().toISOString();

  const row = {
    respondent_id: respondentId,
    platform_pid: null,
    block_id: "TEST",
    survey_version: "connection-test-v1",
    status: "completed",
    payload: {
      connection_test: true,
      source: "github-pages-test",
      respondent_id: respondentId,
      browser_time: now
    },
    quality: { test_only: true },
    client_started_at: now,
    client_submitted_at: now,
    client_duration_sec: 0,
    user_agent: navigator.userAgent
  };

  try{
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/survey_submissions",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(row),
        signal: controller.signal
      }
    );

    clearTimeout(timeout);

    if(!response.ok){
      const text = await response.text();
      throw new Error("HTTP " + response.status + "\n" + text);
    }

    result.className = "box ok";
    result.textContent =
      "成功！\n\n" +
      "respondent_id = " + respondentId + "\n" +
      "HTTP status = " + response.status + "\n\n" +
      "现在去 Supabase → Table Editor → survey_submissions 检查是否新增了这一行。";

  }catch(err){
    result.className = "box err";
    result.textContent =
      "连接失败。\n\n" +
      String(err && err.message ? err.message : err) +
      "\n\n请把这里的完整报错文字发给我，不要自己修改数据库设置。";
  }finally{
    btn.disabled = false;
  }
}

btn.addEventListener("click", sendTest);
</script>
</body>
</html>
